<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6200ea">
    <meta name="description" content="A modern, glassmorphic Notes PWA with offline support and premium UI.">
    <title>ZenNotes - Modern PWA Notes</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme"> <!-- Default to Dark Theme for premium look -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="icons/icon-192.png" alt="ZenNotes Logo" width="32" height="32">
                    <span>ZenNotes</span>
                </div>
                <button class="close-sidebar" onclick="toggleMenu()" aria-label="Close Menu">✕</button>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active" onclick="filterNotes('all')">
                        <span class="icon">📝</span> All Notes
                    </li>
                    <li onclick="filterNotes('pinned')">
                        <span class="icon">📌</span> Pinned
                    </li>
                    <li onclick="toggleDarkMode()">
                        <span class="icon theme-icon">☀️</span> <span class="theme-text">Light Mode</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="app-header">
                <div class="header-left">
                    <button class="hamburger" onclick="toggleMenu()" aria-label="Open Menu">☰</button>
                    <h1>My Notes</h1>
                </div>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search notes..." oninput="searchNotes()">
                    <span class="search-icon">🔍</span>
                </div>
            </header>

            <!-- Notes Grid -->
            <section id="notesContainer" class="notes-grid">
                <!-- Notes will be injected here -->
            </section>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon">📂</div>
                <p>No notes found. Create your first note!</p>
            </div>
        </main>

        <!-- Floating Add Button -->
        <button class="add-btn" onclick="openNoteModal()" aria-label="Add Note">
            <span class="plus-icon">+</span>
        </button>

        <!-- Note Modal -->
        <div id="noteModal" class="modal hidden">
            <div class="modal-content glass-effect">
                <div class="modal-header">
                    <input type="text" id="noteTitle" placeholder="Title" maxlength="50">
                    <button class="close-modal" onclick="closeNoteModal()">✕</button>
                </div>
                <textarea id="noteText" placeholder="Start typing..."></textarea>
                <div class="modal-footer">
                    <div class="color-picker" id="colorPicker">
                        <div class="color-opt active" data-color="default" style="background: var(--card-bg);"></div>
                        <div class="color-opt" data-color="blue" style="background: rgba(0, 122, 255, 0.2);"></div>
                        <div class="color-opt" data-color="purple" style="background: rgba(175, 82, 222, 0.2);"></div>
                        <div class="color-opt" data-color="green" style="background: rgba(52, 199, 89, 0.2);"></div>
                        <div class="color-opt" data-color="red" style="background: rgba(255, 59, 48, 0.2);"></div>
                    </div>
                    <button class="save-btn" onclick="saveNote()">Save Note</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
